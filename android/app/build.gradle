plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-analytics-ktx"  // KTX for Kotlin compatibility
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-storage-ktx"
}

android {
    namespace = "com.gosoftware.admindashboard"
    compileSdkVersion 34  // Specify version directly for clarity
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = "11"
    }

    defaultConfig {
        applicationId "com.gosoftware.admindashboard"
        minSdkVersion 23  // Firebase plugins require minSdk 23 or higher
        targetSdkVersion 33  // Specify version directly for clarity
        versionCode flutter.versionCode
        versionName flutter.versionName
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    // buildTypes {
    //     release {
    //         signingConfig signingConfigs.debug  // Fallback to debug signing config if not specified
    //         minifyEnabled false  // Disable ProGuard for easier debugging
    //         proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
    //     }
    // }

    buildTypes {
        release {
            signingConfig signingConfigs.debug  // Fallback to debug signing config if not specified
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            minifyEnabled true // Enable code shrinking for release builds
            shrinkResources true // Enable resource shrinking

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false // No code shrinking in debug builds
            shrinkResources false // Disable resource shrinking in debug builds
        }
    }
}

flutter {
    source = "../.."
}

apply plugin: 'com.google.gms.google-services'



