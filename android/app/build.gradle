plugins {
    id "com.android.application"
    id "com.google.gms.google-services"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

dependencies {
    implementation platform("com.google.firebase:firebase-bom:33.5.1")
    implementation "com.google.firebase:firebase-analytics-ktx"
    implementation "com.google.firebase:firebase-auth-ktx"
    implementation "com.google.firebase:firebase-firestore-ktx"
    implementation "com.google.firebase:firebase-storage-ktx"
}

android {
    namespace = "com.gosoftware.admindashboard"
    compileSdk 35  // Changed from compileSdkVersion
    ndkVersion = "25.1.8937393"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId "com.gosoftware.admindashboard"
        minSdk 23  // Changed from minSdkVersion
        targetSdk 34  // Changed from targetSdkVersion and updated to 34
        versionCode flutter.versionCode
        versionName flutter.versionName
        
        // Removed x86 architecture for better compatibility
        ndk {
            abiFilters 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            shrinkResources false
            // Add debug-specific optimizations
            debuggable true
        }
    }
}

flutter {
    source = "../.."
}

// Move this to the end to avoid plugin conflicts
apply plugin: 'com.google.gms.google-services'